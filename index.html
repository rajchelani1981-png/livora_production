
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <link rel="stylesheet" href="./css/index.css">
</head>

<body>

    <div class="glow"></div>

    <div class="container">

        <!-- Replace logo.png with your logo image -->
        <img src="./assets/image/logo.png" alt="Company Logo" class="logo">

        <h1>COMING SOON</h1>

        <p>
            Something amazing is on its way!<br>
            We are working hard to bring you something special.
            Stay tuned.
        </p>

        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <small>DAYS</small>
            </div>

            <div class="time-box">
                <span id="hours">00</span>
                <small>HOURS</small>
            </div>

            <div class="time-box">
                <span id="minutes">00</span>
                <small>MINUTES</small>
            </div>

            <div class="time-box">
                <span id="seconds">00</span>
                <small>SECONDS</small>
            </div>
        </div>

        <div class="footer">
            &copy; <span id="year"></span> All Rights Reserved.
        </div>

    </div>

    <script src="./js/index.js"></script>

</body>
</html>
